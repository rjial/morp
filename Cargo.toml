[package]
name = "mocp"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
cpal = "0.15"
symphonia = { version = "0.5", features = ["all"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"
rand = "0.8"
walkdir = "2.5"
notify-rust = "4.11"
fuzzy-matcher = "0.3"
toml = "0.8"
souvlaki = "0.7"

